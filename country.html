<main class="wrap"><div class="top"><a class="back" href="/">← JPMangaatlas</a><h1 id="title">Manga</h1></div><div class="market-links"><a href="/country.html?country=JP">🇯🇵 Japan</a><a href="/country.html?country=US">🇺🇸 United States</a><a href="/country.html?country=FR">🇫🇷 France</a><a href="/country.html?country=BR">🇧🇷 Brazil</a></div><p id="seoIntro" class="seo-intro"></p><div id="grid" class="grid"></div></main><script>const sb=supabase.createClient('https://vcrrkyqiunczhpxdcoil.supabase.co','sb_publishable_IWiCOqUZ7PtPaISAo_5RDw_9uTvyD4z');const map={JP:['🇯🇵 Japanese Manga RAW','Japan','Japanese Manga RAW, Manga RAW and latest Japanese manga chapters.','Japanese Manga RAW and Manga RAW latest chapters. Browse Japanese manga titles with Japanese and English RAW search terms on JPMangaatlas.'],US:['🇺🇸 United States Manga','United States','Manga titles and latest manga chapters from the United States market.','Browse United States manga titles, information and latest chapters on JPMangaatlas.'],FR:['🇫🇷 France Manga','France','Manga titles and latest manga chapters from the French market.','Browse French manga titles, information and latest chapters on JPMangaatlas.'],BR:['🇧🇷 Brazil Manga','Brazil','Manga titles and latest manga chapters from the Brazilian market.','Browse Brazilian manga titles, information and latest chapters on JPMangaatlas.']};const jpNames=[['HUNTER×HUNTER','HUNTER×HUNTER'],['ONE PIECE','ONE PIECE'],['SAKAMOTO DAYS','SAKAMOTO DAYS'],['カグラバチ','Kagurabachi'],['キングダム','Kingdom'],['ブルーロック','Blue Lock'],['薫る花は凛と咲く','The Fragrant Flower Blooms with Dignity']];const jpKeywords=['漫画 RAW','漫画raw','漫画 RAW 無料','漫画 RAW 最新','漫画 RAW 最新話','漫画 RAW 最新話 無料','日本漫画 RAW','Japanese Manga RAW','Manga RAW','Manga Raw','Manga RAW Latest Chapter','Manga RAW Online'];const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');const code=(new URLSearchParams(location.search).get('country')||'').toUpperCase();async function init(){const info=map[code];if(!info){document.getElementById('title').textContent='Country not found';document.getElementById('seoIntro').textContent='The requested country page could not be found.';return}document.documentElement.lang=code==='JP'?'ja':'en';document.getElementById('title').textContent=info[0];document.getElementById('seoIntro').textContent=info[2];document.title=`${info[0]} | JPMangaatlas`;document.getElementById('metaDescription').content=info[3];document.getElementById('canonical').href=`https://mangaatlasjpraw.github.io/country.html?country=${code}`;document.getElementById('ogTitle').content=`${info[0]} | JPMangaatlas`;document.getElementById('ogDescription').content=info[3];const grid=document.getElementById('grid');const {data,error}=await sb.from('manga').select('id,title,author,description,cover_url,status,slug,keywords,native_title').eq('country',code).order('title');if(error||!data?.length){grid.innerHTML='<div class="empty">No manga published for this country yet.</div>';return}grid.innerHTML=data.map(x=>{let variants=[];if(code==='JP'){const found=jpNames.find(n=>n[0]===x.title||n[0]===x.native_title);const en=found?.[1]||x.title;const ja=x.native_title||x.title;variants=[`${ja} RAW`,`${en} RAW`]}const all=[...(x.keywords||[]),...variants,...(code==='JP'?jpKeywords:[])];return `<a class="card" href="/manga/${encodeURIComponent(x.slug)}"><img src="${esc(x.cover_url||'https://placehold.co/600x800/171922/ffffff?text=Manga')}" alt="${esc(x.title)} cover" loading="lazy"><h2 style="font-size:17px;margin:10px 0 5px">${esc(x.title)}${variants.length?` <span style="font-size:11px;color:#818897">(${esc(variants.join(' / '))})</span>`:''}</h2><p>${esc(x.author||'')}${x.status?` · ${esc(x.status)}`:''}</p><p>${esc(x.description||'')}</p>${all.length?`<div class="keywords">${[...new Set(all)].map(k=>`<span class="keyword">${esc(k)}</span>`).join('')}</div>`:''}</a>`}).join('')}init();</script>
