<!doctype html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="description" content="Manga information, chapters and latest releases on JPMangaatlas."><title>Manga | JPMangaatlas</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0e;color:#f5f5f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:1200px;margin:auto;padding:30px 5% 70px}.back{color:#a8adba;text-decoration:none}.hero{display:grid;grid-template-columns:260px 1fr;gap:35px;margin-top:28px}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px}.title{font-size:clamp(34px,5vw,58px);margin:8px 0}.native{color:#aab0bd;font-size:18px}.meta{color:#9298a8;line-height:1.8}.chapters{margin-top:42px}.section-title{font-size:25px}.chapter-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.chapter{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 18px;background:#10131a;border:1px solid #252a35;border-radius:12px;color:#fff;text-decoration:none}.chapter:hover{border-color:#5b8bd9}.chapter small{display:block;color:#818897;margin-top:5px}.arrow{font-size:20px;color:#789bd0}.empty{text-align:center;padding:60px 20px;color:#858c9b}.error{color:#ff8c9b}@media(max-width:800px){.hero{grid-template-columns:1fr}.cover{max-width:260px}.chapter-list{grid-template-columns:1fr}}@media(min-width:801px) and (max-width:1050px){.chapter-list{grid-template-columns:1fr 1fr}}</style><script src="/analytics.js?v=1"></script></head><body><main class="wrap"><link id="canonical" rel="canonical" href="https://mangaatlasjpraw.github.io/manga.html"><a class="back" href="/">← JPMangaatlas</a><div id="app"><div class="empty">Loading manga…</div></div></main><script>
(function(){'use strict';
var slug='';try{slug=new URLSearchParams(location.search).get('slug')||''}catch(e){}if(!slug){var m=location.pathname.match(/^\/manga\/(.+)$/);if(m)slug=decodeURIComponent(m[1])}
function norm(v){return String(v||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').replace(/^-+|-+$/g,'').replace(/-raw$/,'').replace(/-ja$/,'')}
function aliases(v){var n=norm(v);return [n,n.replace(/-ja$/,''),n.replace(/-raw$/,'')].filter(Boolean)}
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(x){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'})[x]})}
function get(path){return fetch(path+'?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error();return r.json()}).catch(function(){return {}})}
function unwrap(d){if(d&&typeof d.content==='string'){try{return JSON.parse(d.content)}catch(e){}}return d||{}}
function mangaKey(m){return norm(m&&(m.id||m.mangaId||m.slug||m.title||m.name))}
function chapterMatches(c,manga,mangas){var vals=[c&&c.mangaId,c&&c.manga_id,c&&c.seriesId,c&&c.series_id,c&&c.manga,c&&c.mangaTitle,c&&c.series].filter(Boolean);var target=aliases(mangaKey(manga));for(var i=0;i<vals.length;i++){var a=aliases(vals[i]);if(a.some(function(x){return target.indexOf(x)>=0||target.some(function(t){return t===x})}))return true}
var s=norm(c&&c.slug);for(var j=0;j<target.length;j++){if(s===target[j]||s.indexOf(target[j]+'-')===0||s.indexOf(target[j].replace(/-/g,''))===0)return true}return false}
function num(c){var n=Number(c&&c.number);if(Number.isFinite(n))return n;var m=String(c&&c.title||c&&c.slug||'').match(/(?:chapter|chap|第)[^0-9]*([0-9]+)/i);return m?Number(m[1]):-1}
function unique(a){var s={};return a.filter(function(c){var k=String(c&&c.slug||'');if(!k||s[k])return false;s[k]=1;return true})}
function inferManga(slug,chapters){var wanted=norm(slug);var c=chapters.find(function(x){var vals=[x.mangaId,x.manga_id,x.seriesId,x.series_id,x.manga,x.mangaTitle,x.series].filter(Boolean);return vals.some(function(v){var a=aliases(v);return a.indexOf(wanted)>=0})||norm(x.slug).indexOf(wanted+'-')===0});if(!c)return null;var id=c.mangaId||c.manga_id||c.seriesId||c.series_id||c.manga;return {id:id||wanted,slug:slug,title:c.mangaTitle||c.manga||c.series||String(id||slug).replace(/-/g,' '),country:c.country||'JP',language:c.language||'ja',cover:c.cover||c.cover_url||''}}
function render(manga,chapters){var app=document.getElementById('app');document.title=(manga.title||'Manga')+' | JPMangaatlas';document.getElementById('canonical').href='https://mangaatlasjpraw.github.io/manga.html?slug='+encodeURIComponent(manga.slug||manga.id);var cover=manga.cover||manga.cover_url||'https://placehold.co/640x860/151821/ffffff?text=Manga';chapters=unique(chapters).sort(function(a,b){return num(b)-num(a)});var list=chapters.length?chapters.map(function(c){return '<a class="chapter" href="/chapter.html?slug='+encodeURIComponent(c.slug)+'"><div><strong>Chapter '+esc(num(c)>-1?num(c):'')+(c.title?' — '+esc(c.title):'')+'</strong><small>'+esc(c.slug)+'</small></div><span class="arrow">→</span></a>'}).join(''):'<div class="empty">No published chapters added yet.</div>';app.innerHTML='<div class="hero"><img class="cover" src="'+esc(cover)+'" alt="'+esc(manga.title)+'"><div><div class="meta">'+esc(manga.country||'')+' · '+esc(manga.language||'')+'</div><h1 class="title">'+esc(manga.title||manga.name||'Manga')+'</h1>'+(manga.native_title?'<div class="native">'+esc(manga.native_title)+'</div>':'')+'<p class="meta">'+esc(manga.description||'Manga chapters and raw releases on JPMangaatlas.')+'</p></div></div><section class="chapters"><h2 class="section-title">📚 Published Chapters ('+chapters.length+')</h2><div class="chapter-list">'+list+'</div></section>'}
function boot(){if(!slug){document.getElementById('app').innerHTML='<div class="empty error">Manga not found.</div>';return}Promise.all([get('/data/content.json'),get('/data/manual-chapters.json')]).then(function(ds){var base=unwrap(ds[0]),manual=unwrap(ds[1]),mangas=Array.isArray(base.mangas)?base.mangas:[],published=(base.chapters||[]).concat(manual.chapters||[]),manga=mangas.find(function(x){return norm(x.slug||x.id||x.title)===norm(slug)});if(!manga)manga=inferManga(slug,published);if(!manga){document.getElementById('app').innerHTML='<div class="empty error">Manga not found.</div>';return}var chapters=published.filter(function(c){return chapterMatches(c,manga,mangas)});render(manga,chapters)}).catch(function(){document.getElementById('app').innerHTML='<div class="empty error">Unable to load manga.</div>'})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();})();
</script></body></html>
