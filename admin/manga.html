<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manga Admin | JPMangaatlas</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f4f5f7;font-family:system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.nav a{color:#b9c0ce;text-decoration:none;padding:9px 12px;border:1px solid #292e39;border-radius:8px}.panel{background:#101118;border:1px solid #292e39;border-radius:12px;padding:18px;margin:14px 0}h1,h2{margin-top:0}label{display:block;color:#aeb3c0;font-size:13px;margin:10px 0 5px}input,select{width:100%;background:#090b10;color:#fff;border:1px solid #303542;border-radius:8px;padding:10px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:8px;padding:10px 14px;background:#3f73c9;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#292e39}.muted{color:#aeb3c0;font-size:13px}.status{background:#171b23;padding:10px;border-radius:8px;margin-top:10px;white-space:pre-wrap}.list{display:grid;gap:8px}.item{border:1px solid #292e39;border-radius:9px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.cover{width:42px;height:56px;object-fit:cover;border-radius:6px;background:#181b22;margin-right:10px}.pager{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:14px}.itemmain{display:flex;align-items:center}@media(max-width:700px){.row{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><div class="nav"><a href="/admin/">⚙️ Dashboard</a><a href="/admin/chapters.html">📚 Chapters</a><a href="/admin/manga.html">📖 Manga</a><a href="/">Open site</a></div><h1>📖 Manga</h1><div id="login" class="panel"><h2>GitHub Admin Access</h2><input id="token" type="password" placeholder="github_pat_…"><div class="actions"><button id="connect">Connect</button></div><div id="loginStatus" class="status"></div></div><div id="app" class="hidden"><div class="panel"><div class="actions"><button id="newManga">＋ Add manga</button><button class="secondary" id="logout">Forget token</button></div></div><div class="panel"><div id="stats" class="muted"></div><div id="mangaList" class="list"></div><div class="pager"><button class="secondary" id="prev">← Previous</button><span id="pageInfo" class="muted"></span><button class="secondary" id="next">Next →</button></div></div><div id="editor" class="panel hidden"><h2 id="heading">Add manga</h2><div class="row"><div><label>Title</label><input id="title"></div><div><label>Slug</label><input id="slug"></div><div><label>Native title</label><input id="native"></div><div><label>Country</label><select id="country"><option>JP</option><option>US</option><option>FR</option><option>BR</option></select></div></div><label>Cover image</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp"><div class="actions"><button id="save">Save manga</button><button class="secondary" id="cancel">Cancel</button></div></div><div id="status" class="status"></div></div><script>'use strict';const O='MangaAtlasJp',R='MangaAtlasJp.github.io',B='main',D='data/content.json',PER=25;let token=sessionStorage.getItem('mangaatlas_github_token')||'',data=null,sha='',editId=null,page=1;const $=x=>document.getElementById(x);const sleep=m=>new Promise(r=>setTimeout(r,m));function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function auth(){return{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'}}async function api(p,o={},a=0){const r=await fetch('https://api.github.com/repos/'+O+'/'+R+p,{...o,headers:{...auth(),...(o.headers||{})},cache:'no-store'});const t=await r.text();if((r.status===409||r.status===429||r.status>=500)&&a<4){await sleep(700*(a+1));return api(p,o,a+1)}if(!r.ok)throw Error('GitHub '+r.status+': '+t.slice(0,700));return t?JSON.parse(t):{}}async function read(){const x=await api('/contents/'+D+'?ref='+B);const raw=atob(x.content.replace(/\n/g,''));data=JSON.parse(decodeURIComponent(escape(raw)));sha=x.sha}function b64(b){let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(s)}async function write(msg){const bytes=new TextEncoder().encode(JSON.stringify(data,null,2)+'\n');const x=await api('/contents/'+D,{method:'PUT',body:JSON.stringify({message:msg,content:b64(bytes),sha,branch:B})});sha=x.content.sha}function setStatus(x){$('status').textContent=x}function sorted(){return(data.mangas||[]).map((m,i)=>({...m,__i:i})).sort((a,b)=>{const ad=Date.parse(a.updated_at||a.created_at||'')||0,bd=Date.parse(b.updated_at||b.created_at||'')||0;return bd-ad||b.__i-a.__i})}function render(){const all=sorted(),pages=Math.max(1,Math.ceil(all.length/PER));if(page>pages)page=pages;const slice=all.slice((page-1)*PER,page*PER);$('stats').textContent=`${all.length} total manga · Showing ${slice.length} · 25 per page`;$('mangaList').innerHTML=slice.map(m=>`<div class="item"><div class="itemmain">${m.cover?`<img class="cover" src="${esc(m.cover)}" alt="">`:''}<div><b>${esc(m.title)}</b><br><small class="muted">${esc(m.native_title||'')} · ${esc(m.country)} · ${esc(m.slug)}</small></div></div><button class="secondary" onclick="editManga('${esc(m.id)}')">Edit</button></div>`).join('')||'<div class="muted">No manga.</div>';$('pageInfo').textContent=`Page ${page} / ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages}function reset(){editId=null;$('heading').textContent='Add manga';['title','slug','native'].forEach(x=>$(x).value='');$('country').value='JP';$('cover').value='';$('editor').classList.add('hidden')}window.editManga=id=>{const m=(data.mangas||[]).find(x=>x.id===id);if(!m)return;editId=id;$('heading').textContent='Edit manga';$('title').value=m.title||'';$('slug').value=m.slug||'';$('native').value=m.native_title||'';$('country').value=m.country||'JP';$('cover').value='';$('editor').classList.remove('hidden');window.scrollTo({top:$('editor').offsetTop-20,behavior:'smooth'})};$('newManga').onclick=()=>{$('editor').classList.remove('hidden');reset();$('editor').classList.remove('hidden')};$('cancel').onclick=reset;$('prev').onclick=()=>{if(page>1){page--;render();window.scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'})};$('logout').onclick=()=>{sessionStorage.removeItem('mangaatlas_github_token');location.reload()};$('connect').onclick=async()=>{token=$('token').value.trim();if(!token)return;$('loginStatus').textContent='Connecting…';try{await api('/contents/'+D+'?ref='+B);sessionStorage.setItem('mangaatlas_github_token',token);location.reload()}catch(e){$('loginStatus').textContent='Error: '+e.message}};function file64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(Error('Could not read '+f.name));r.readAsDataURL(f)})}$('save').onclick=async()=>{try{const title=$('title').value.trim(),slug=$('slug').value.trim();if(!title||!slug)throw Error('Title and slug are required.');await read();if(editId){const m=data.mangas.find(x=>x.id===editId);if(!m)throw Error('Manga not found.');Object.assign(m,{title,slug,native_title:$('native').value.trim(),country:$('country').value,updated_at:new Date().toISOString()})}else{const id=slug.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(!id)throw Error('Use an English/Latin slug.');if(data.mangas.some(m=>m.id===id))throw Error('Manga slug already exists.');data.mangas.push({id,title,slug,native_title:$('native').value.trim(),country:$('country').value,language:$('country').value==='JP'?'ja':'en',cover:'https://placehold.co/300x400',created_at:new Date().toISOString(),updated_at:new Date().toISOString()});editId=id}const f=$('cover').files[0];if(f){const bytes=new Uint8Array(await f.arrayBuffer());const path='manga-covers/'+slug.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const r=await api('/contents/'+path,{method:'PUT',body:JSON.stringify({message:'Upload manga cover '+title,content:b64(bytes),branch:B})});const m=data.mangas.find(x=>x.id===editId);m.cover=r.content.download_url||'https://raw.githubusercontent.com/'+O+'/'+R+'/'+B+'/'+path}await write(editId?'Update manga':'Add manga');render();$('editor').classList.add('hidden');setStatus('✓ Manga saved.')}catch(e){setStatus('Error: '+e.message)}};async function boot(){if(!token)return;try{await read();$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}catch(e){$('loginStatus').textContent='Error: '+e.message}}boot();</script></body></html>
