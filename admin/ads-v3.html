<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>JPMangaatlas Ads System</title><style>body{margin:0;background:#08090d;color:#eee;font:15px system-ui}.w{max-width:1000px;margin:auto;padding:20px}.nav{display:flex;gap:12px;flex-wrap:wrap}.nav a{color:#fff}.box{background:#11131a;border:1px solid #303644;border-radius:10px;padding:15px;margin:14px 0}.ad{border:1px solid #303644;padding:14px;margin:10px 0;border-radius:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea,button{box-sizing:border-box;padding:9px;border-radius:7px;border:1px solid #343a48;background:#090b10;color:#fff;font:inherit}textarea{width:100%;min-height:120px;font-family:ui-monospace,monospace}button{background:#3f73c9;font-weight:700;cursor:pointer}.msg{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#aeb3c0}label{display:block;margin:10px 0;color:#c7cbd4}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="nav"><a href="/admin/">Dashboard</a><a href="chapters.html">Chapters</a><a href="manga.html">Manga</a><a href="/">Site</a></div><h1>📢 Ads System</h1><div class="box"><b>9 independent ad sections</b><p class="muted">Each section can be enabled or disabled independently. Choose its placement and edit its code. Changes are saved to this repository's data/ads-config.json.</p><p id="msg" class="msg"></p></div><div id="list"></div><div class="box"><button id="save">Save all Ads to GitHub</button> <button id="reload">Reload</button></div></div><script>'use strict';const K='mangaatlas_github_token',O='MangaAtlasjpraw',R='MangaAtlasJpraw.github.io',B='main',P='data/ads-config.json';let token=sessionStorage.getItem(K)||'',sha='',cfg={version:2,sections:[]};const $=x=>document.getElementById(x),enc=s=>{const u=new TextEncoder().encode(s);let z='';for(let i=0;i<u.length;i+=32768)z+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(z)},dec=s=>{const b=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))};function defaults(){return [{"id":"ad-1","name":"Ad Section 1","enabled":false,"code":"","placement":"start","between":"2"},{"id":"ad-2","name":"Ad Section 2","enabled":false,"code":"","placement":"end","between":"1"},{"id":"ad-3","name":"Ad Section 3","enabled":false,"code":"","placement":"between","between":"1"},{"id":"ad-4","name":"Ad Section 4","enabled":false,"code":"","placement":"start","between":"0"},{"id":"ad-5","name":"Ad Section 5","enabled":false,"code":"","placement":"between","between":"1"},{"id":"ad-6","name":"Ad Section 6","enabled":false,"code":"","placement":"end","between":"12"},{"id":"ad-7","name":"Ad Section 7","enabled":false,"code":"","placement":"between","between":"7"},{"id":"ad-8","name":"Ad Section 8","enabled":false,"code":"","placement":"between","between":"12"},{"id":"ad-9","name":"Ad Section 9","enabled":false,"code":"","placement":"between","between":"10"}]}async function api(p,o={}){const r=await fetch('https://api.github.com/repos/'+O+'/'+R+p,{...o,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json',...(o.headers||{})},cache:'no-store'});const t=await r.text();let x={};try{x=t?JSON.parse(t):{}}catch{}if(!r.ok)throw Error('GitHub '+r.status+': '+(x.message||t));return x}async function load(){if(!token){cfg={version:2,sections:defaults()};render();$('msg').textContent='GitHub token required. Open Chapters or Manga admin and connect first, then return here.';return}try{const x=await api('/contents/'+P+'?ref='+B);sha=x.sha;cfg=JSON.parse(dec(x.content));if(!Array.isArray(cfg.sections))cfg={version:2,sections:defaults()};render();$('msg').textContent='✓ Loaded configuration from the JPMangaatlas repository.'}catch(e){$('msg').textContent='Load failed: '+e.message;cfg={version:2,sections:defaults()};render()}}function render(){if(!cfg.sections.length)cfg.sections=defaults();$('list').innerHTML=cfg.sections.map((a,i)=>'<div class="ad" data-i="'+i+'"><h3>'+String(a.id||('ad-'+(i+1)))+'</h3><div class="grid"><label>Name<input class="name" value="'+String(a.name||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"></label><label><input class="enabled" type="checkbox" '+(a.enabled?'checked':'')+'> Enabled</label></div><label>Placement<select class="placement"><option value="start" '+(a.placement==='start'?'selected':'')+'>Start</option><option value="between" '+(a.placement==='between'?'selected':'')+'>Between chapter images</option><option value="end" '+(a.placement==='end'?'selected':'')+'>End</option></select></label><label>After image number<input class="between" type="number" min="1" max="100" value="'+(a.between||5)+'"></label><label>Ad code<textarea class="code" spellcheck="false">'+String(a.code||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</textarea></label></div>').join('')}function collect(){cfg.version=2;cfg.sections=[...document.querySelectorAll('.ad')].map((e,i)=>({id:cfg.sections[i]?.id||('ad-'+(i+1)),name:e.querySelector('.name').value.trim()||('Ad Section '+(i+1)),enabled:e.querySelector('.enabled').checked,code:e.querySelector('.code').value,placement:e.querySelector('.placement').value,between:e.querySelector('.between').value}))}$('save').onclick=async()=>{collect();if(!token){$('msg').textContent='GitHub token required.';return}try{const x=await api('/contents/'+P,{method:'PUT',body:JSON.stringify({message:'Update JPMangaatlas ads configuration',content:enc(JSON.stringify(cfg,null,2)+'\n'),sha,branch:B})});sha=x.content.sha;$('msg').textContent='✓ Ads configuration saved to GitHub.'}catch(e){$('msg').textContent='Save failed: '+e.message}};$('reload').onclick=load;load()</script></body></html>
